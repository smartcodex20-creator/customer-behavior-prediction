version: "3.8"

services:
  api:
    build: .
    container_name: cbpp-api
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed
    restart: unless-stopped

  frontend:
    image: python:3.12-slim
    container_name: cbpp-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5500:5500"
    command: python -m http.server 5500
    depends_on:
      - api
    restart: unless-stopped